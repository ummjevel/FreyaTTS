# FreyaTTS from-scratch pretraining -- 88M variant
# usage: SIZE=88M GPUS=0,1,2,3 bash script/12_pretrain_v2.sh
#
# Same schedule as configs/pretrain.yaml; only the model dims differ. Kept as a
# file (rather than CLI overrides) so the 88M/127M/183M runs are reproducible --
# passing dims by hand is how a run silently ends up with the wrong architecture.

data: data/latents
vocab_json: freyatts/char_vocab.json
out: checkpoints/pretrain_88M

# model (88M: 87,510,081 params at vocab=127)
d_model: 512
depth: 12
heads: 8
ff: 1536

# optimization -- identical to the 337M run
steps: 150000
batch_size: 64
grad_accum: 1
lr: 5.0e-4
warmup: 2000
lambda_dur: 0.1

max_frames: 500
num_workers: 3

save_every: 10000
log_every: 50
seed: 0
