[project]
name = "freyatts"
version = "0.1.0"
description = "FreyaTTS (Korean fork): tokenizer-free flow-matching TTS, distilled onto Qwen3-TTS-designed voices."
readme = "README.md"
license = { file = "LICENSE" }
# Upper bound is deliberate: on a just-released Python (e.g. 3.14), pip/uv
# will otherwise still *try* to resolve/build this and its dependency tree,
# and fail deep inside pip's or a dependency's internals with a confusing
# error instead of a clear "unsupported Python version" message. Bump this
# once the dependency chain has caught up.
requires-python = ">=3.10,<3.14"
# No `voxcpm` dependency: only its AudioVAEV2 module is needed, which is
# vendored in-tree (freyatts/_vendor/audiovae/, Apache-2.0, from
# openbmb/VoxCPM). The full `voxcpm` package additionally requires funasr,
# gradio, modelscope, and a librosa->numba->llvmlite chain that has
# repeatedly failed to build on newer Python releases -- none of which
# FreyaTTS actually uses.
dependencies = [
    "torch",
    "numpy",
    "einops",
    "soundfile",
    "huggingface_hub",
    "safetensors",
    "pydantic",
    "uroman",
]

# librosa (-> numba -> llvmlite) is only used by an optional collapse-retry
# quality check in pipeline.py's _voiced_ok(), which is already wrapped in a
# try/except and silently no-ops without it. numba/llvmlite regularly lag
# new CPython releases by many months and can fail to build entirely on a
# just-released interpreter (seen: llvmlite 0.36.0 refusing Python 3.14),
# so it's opt-in rather than a hard dependency.
[project.optional-dependencies]
quality-check = ["librosa"]

[project.urls]
Homepage = "https://github.com/ummjevel/FreyaTTS"

# Only the small inference package (freyatts/) is installable -- training
# scripts, eval, and sbatch pipeline stay as repo-root files/scripts, not
# part of the pip package.
[tool.setuptools.packages.find]
include = ["freyatts*"]

# char_vocab.json is loaded at runtime relative to the package (see
# pipeline.py's from_pretrained) but setuptools doesn't bundle non-.py
# files by default -- without this, installed copies of the package are
# missing it and crash on first use.
[tool.setuptools.package-data]
freyatts = ["char_vocab.json"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
