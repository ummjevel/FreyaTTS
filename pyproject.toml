[project]
name = "freyatts"
version = "0.1.0"
description = "FreyaTTS (Korean fork): tokenizer-free flow-matching TTS, distilled onto Qwen3-TTS-designed voices."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "torch",
    "numpy",
    "einops",
    "soundfile",
    "huggingface_hub",
    "safetensors",
    "voxcpm",
    "uroman",
]

# librosa (-> numba -> llvmlite) is only used by an optional collapse-retry
# quality check in pipeline.py's _voiced_ok(), which is already wrapped in a
# try/except and silently no-ops without it. numba/llvmlite regularly lag
# new CPython releases by many months and can fail to build entirely on a
# just-released interpreter (seen: llvmlite 0.36.0 refusing Python 3.14),
# so it's opt-in rather than a hard dependency.
[project.optional-dependencies]
quality-check = ["librosa"]

[project.urls]
Homepage = "https://github.com/ummjevel/FreyaTTS"

# Only the small inference package (freyatts/) is installable -- training
# scripts, eval, and sbatch pipeline stay as repo-root files/scripts, not
# part of the pip package.
[tool.setuptools.packages.find]
include = ["freyatts*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
